<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guerrera">
<title>Guerrera Espartana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DISEÑO "BRONCE Y ESCARLATA": fondo carbón cálido, acento rojo
   espartano (capa) y bronce (escudo). Mismo esqueleto que Barra Libre.
   ============================================================ */
:root{
  --bg:#15130f; --surface:#1e1b17; --surface-2:#28241f; --line:#3a342c;
  --text:#ece7df; --muted:#a59c90; --faint:#6b6358;
  --accent:#d9473f; --accent-deep:#9e2a24; --ok:#4bae6e; --warn:#e0b020; --bad:#e0594e;
  --warm:#e6b867; --blue:#5aa7d8;
  --radius:14px;
  --p25:#d12c2c; --p20:#2f6fd0; --p15:#e0b020; --p10:#3aa657; --p5:#e8eaed; --p2:#c0392b; --p1:#9aa3ad;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);overscroll-behavior-y:contain}
h1,h2,h3,.cond{font-family:'Barlow Condensed',sans-serif;letter-spacing:.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:20;background:rgba(21,19,15,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:'Barlow Condensed';font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.brand b span{color:var(--accent)}
.shield{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f1cf8a,var(--warm) 45%,#8a6526);
  display:flex;align-items:center;justify-content:center;color:var(--accent-deep);font-family:'Barlow Condensed';font-weight:800;font-size:18px;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.session-pill{font-family:'Barlow Condensed';font-weight:700;font-size:12.5px;text-transform:uppercase;background:var(--surface-2);
  border:1px solid var(--line);padding:5px 10px;border-radius:999px;color:var(--warm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
main{max-width:560px;margin:0 auto;padding:16px 14px 100px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(21,19,15,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:8px 4px calc(env(safe-area-inset-bottom) + 8px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:9.5px;font-weight:600;padding:4px 1px}
nav button .ic{font-size:17px;line-height:1}
nav button.active{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;cursor:pointer}
.card-head .left{display:flex;align-items:center;gap:9px;min-width:0;flex-wrap:wrap}
.ex-name{font-family:'Barlow Condensed';font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.ex-scheme{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.ss-tag{font-family:'Barlow Condensed';font-weight:800;font-size:12px;color:#1a0806;background:var(--warm);border-radius:6px;padding:1px 6px}
.chev{color:var(--faint);transition:transform .18s;font-size:12px}
.card.open .chev{transform:rotate(90deg)}
.card-body{display:none;border-top:1px solid var(--line);padding:8px 15px 14px}
.card.open .card-body{display:block}
.body-open{display:block;border:none}
.done-tag{font-size:11px;font-weight:700;color:var(--ok);font-family:'Barlow Condensed';text-transform:uppercase}
.fail-tag{font-size:11px;font-weight:700;color:var(--bad);font-family:'Barlow Condensed';text-transform:uppercase}
.mid-tag{font-size:11px;font-weight:700;color:var(--warn);font-family:'Barlow Condensed';text-transform:uppercase}
.opt-badge{font-family:'Barlow Condensed';font-weight:700;font-size:10px;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:1px 7px;vertical-align:middle}
.set-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--surface-2)}
.set-row:last-child{border-bottom:none}
.set-meta{flex:none;width:84px}
.set-meta .lbl{font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase}
.set-meta .reps{font-family:'Barlow Condensed';font-weight:600;font-size:15px;color:var(--muted)}
.set-w{flex:1;display:flex;align-items:baseline;gap:5px}
.set-w .kg{font-family:'Barlow Condensed';font-weight:800;font-size:28px;line-height:1}
.set-w .u{font-size:12px;color:var(--faint);font-weight:600}
.set-w.workset .kg{color:var(--warm)}
.tick{flex:none;width:42px;height:42px;border-radius:11px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:20px;color:transparent;background:var(--surface-2);transition:.12s}
.tick.on{background:var(--ok);border-color:var(--ok);color:#0c140f}
.tick:active{transform:scale(.92)}
.barbell{display:flex;align-items:center;justify-content:center;gap:1px;height:38px;margin:6px 0 4px}
.barbell .sleeve{height:6px;width:24px;background:var(--faint);border-radius:2px}
.plate{border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:700;font-size:10px;color:#0c0f13;min-width:11px}
.plate.t{color:#fff}
.platecalc-note{font-size:11px;color:var(--faint);text-align:center;margin-top:-2px}
.btn{display:block;width:100%;text-align:center;font-family:'Barlow Condensed';font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  font-size:17px;padding:14px;border-radius:12px;background:var(--accent);color:#fff}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.btn.deep{background:var(--accent-deep);color:#fff}
.btn.sm{font-size:14px;padding:9px 12px;width:auto;display:inline-block}
.btn:disabled{opacity:.4}
.btn-row{display:flex;gap:10px;margin:14px 0}
.btn-row .btn{margin:0}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
input[type=number],input[type=text],input[type=date],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  color:var(--text);padding:11px;font-size:16px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline-num{width:64px!important;padding:8px 4px!important;text-align:center}
.eyebrow{font-family:'Barlow Condensed';font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-size:13px;margin:2px 0 10px}
.h-big{font-family:'Barlow Condensed';font-weight:800;font-size:28px;text-transform:uppercase;line-height:1.05;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.help{font-size:13px;color:var(--muted);background:var(--surface-2);border-left:3px solid var(--warm);border-radius:8px;padding:10px 12px;margin-top:8px}
.help b{color:var(--text)}
.pageref{display:inline-block;margin-top:5px;color:var(--warm);font-weight:600;font-size:12px}
.note{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:13.5px;color:var(--muted);margin:10px 0}
.note b{color:var(--text)}
.note.ok{border-left-color:var(--ok)} .note.warn{border-left-color:var(--bad)}
.tiny{font-size:12px;color:var(--faint)}
.center{text-align:center}
hr.sep{border:none;border-top:1px solid var(--line);margin:18px 0}
.prevline{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:10px}
.prevline b{color:var(--text)}
.dlt{font-family:'Barlow Condensed';font-weight:700;margin-left:3px;white-space:nowrap}
.dlt.up{color:var(--ok)} .dlt.dn{color:var(--bad)} .dlt.eq{color:var(--warn)}
.stat-line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--surface-2);font-size:14px}
.stat-line:last-child{border:none}
.stat-line b{font-family:'Barlow Condensed';font-weight:700;color:var(--warm);font-size:17px;text-align:right}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--accent);color:#fff;font-weight:700;font-family:'Barlow Condensed';
  text-transform:uppercase;padding:11px 20px;border-radius:999px;z-index:70;opacity:0;transition:.25s;pointer-events:none;font-size:14px;letter-spacing:.03em;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,7,6,.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:380px;width:100%;max-height:88vh;overflow-y:auto}
.modal-box p.msg{margin:0 0 16px;font-size:15px;white-space:pre-line}
.dl-title{font-family:'Barlow Condensed';font-weight:800;font-size:21px;text-transform:uppercase;margin:0 0 8px;color:var(--accent)}
.dl-intro{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.dl-cause{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;font-size:13px;color:var(--muted);cursor:pointer}
.dl-cause input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--accent)}
.dl-cause b{color:var(--text)}
.dl-box{background:rgba(217,71,63,.08);border:1px solid rgba(217,71,63,.3);border-radius:10px;padding:11px;margin:10px 0 4px;font-size:13.5px}
.dl-prev{background:var(--bg);border-radius:8px;padding:8px 10px;margin:8px 0 6px;font-size:14px;line-height:1.7}
.dl-prev b{color:var(--warm)}
.rest-pill{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);z-index:40;display:none;align-items:center;gap:12px;
  background:var(--accent);color:#fff;padding:9px 12px 9px 18px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.45);font-family:'Barlow Condensed';font-weight:700;opacity:0;transition:.25s}
.rest-pill.show{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
.rest-pill .rest-lbl{text-transform:uppercase;font-size:13px;letter-spacing:.05em;opacity:.85}
.rest-pill #rest-time{font-size:24px;min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
.rest-pill button{background:rgba(0,0,0,.2);color:#fff;width:28px;height:28px;border-radius:50%;font-size:14px;font-weight:700}
.itimer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));background:var(--accent);color:#fff;border-radius:14px;
  padding:11px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 28px rgba(0,0,0,.5);z-index:65;min-width:250px}
.itimer.rest{background:var(--ok);color:#0c140f}
.it-lab{font-family:'Barlow Condensed';font-weight:700;font-size:15px;text-transform:uppercase;flex:1;line-height:1.1}
.it-lab small{display:block;font-size:11px;opacity:.8}
.it-time{font-family:'Barlow Condensed';font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.it-x{background:rgba(0,0,0,.2);color:inherit;width:26px;height:26px;border-radius:50%;font-size:13px}
/* Segmentados / pestañas */
.seg{display:flex;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:14px}
.seg button{flex:1;font-family:'Barlow Condensed';font-weight:700;font-size:15px;text-transform:uppercase;color:var(--muted);border-radius:9px;padding:9px 2px;letter-spacing:.02em}
.seg button.sel{background:var(--accent);color:#fff}
.seg .pdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warm);vertical-align:middle;margin-left:3px}
.ntabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:4px}
.ntabs button{flex:none;font-family:'Barlow Condensed';font-weight:700;font-size:13px;padding:8px 12px;border-radius:9px;background:var(--surface);
  border:1px solid var(--line);color:var(--muted);text-transform:uppercase;white-space:nowrap}
.ntabs button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.ntabs button:disabled{opacity:.4}
/* Resultado 3 estados + esfuerzo */
.out-q{font-size:13px;color:var(--muted);font-weight:600;display:block;margin-bottom:7px}
.outcome3{display:flex;gap:7px}
.o3{flex:1;font-family:'Barlow Condensed';font-weight:700;font-size:14px;padding:10px 4px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);text-align:center}
.o3.ok.sel{background:var(--ok);border-color:var(--ok);color:#0c140f}
.o3.mid.sel{background:var(--warn);border-color:var(--warn);color:#1a1405}
.o3.no.sel{background:var(--bad);border-color:var(--bad);color:#1a0a08}
.o3-next{margin-top:8px;font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.o3-next b{color:var(--warm)}
.rir{display:flex;gap:6px;margin-top:7px}
.rir-b{flex:1;font-family:'Barlow Condensed';font-weight:700;font-size:17px;padding:9px 0;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.rir-b.sel{color:#160a02;border-color:transparent}
.rir-b.l1.sel{background:#4bae6e}.rir-b.l2.sel{background:#8bbf3f}.rir-b.l3.sel{background:#e0b020}.rir-b.l4.sel{background:#e08a2e}.rir-b.l5.sel{background:#e0594e}
.blk{margin-top:12px}
.stall-note{background:rgba(224,89,78,.1);border:1px solid rgba(224,89,78,.35);border-radius:9px;padding:10px 12px;font-size:13px;color:var(--warm);margin:8px 0}
.edit-w{background:var(--surface-2);border:1px solid var(--line);color:var(--warm);width:26px;height:26px;border-radius:7px;font-size:13px;flex:none;padding:0}
/* Inputs de series (peso corporal / doble progresión) */
.sets-grid{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.sg{display:flex;flex-direction:column;align-items:center;gap:3px}
.sg span{font-family:'Barlow Condensed';font-weight:700;font-size:11px;color:var(--muted)}
.sg input{width:54px;text-align:center;padding:9px 2px}
.lvl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 6px}
.lvl-row .lv{font-family:'Barlow Condensed';font-weight:700;font-size:13px;padding:6px 11px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.lvl-row .lv.sel{background:var(--warm);color:#1a0806;border-color:var(--warm)}
.lvl-row .lbl2{font-size:12px;color:var(--muted);font-weight:600}
.acc-input{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0}
.acc-input span{font-size:13px;color:var(--muted)}
.wu-box{background:var(--surface-2);border-radius:9px;padding:8px 10px;margin:8px 0}
.wu-t{font-family:'Barlow Condensed';font-weight:700;font-size:12px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.wu-s{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;color:var(--muted)}
.wu-s b{color:var(--text)}
.wu-list{margin:4px 0 0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.wu-list li{margin-bottom:3px}
.warmup-card{border-color:rgba(230,184,103,.35)}
/* Ciclo */
.cycle{border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;border:1px solid var(--line);background:var(--surface)}
.cycle-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cycle-ph{font-family:'Barlow Condensed';font-weight:800;font-size:18px;text-transform:uppercase}
.cycle-day{font-size:12px;color:var(--muted);font-weight:600}
.cycle ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.cycle li{margin-bottom:3px}
.cycle.menstrual{border-color:#b33a4a;background:linear-gradient(135deg,rgba(179,58,74,.16),var(--surface) 60%)}
.cycle.folicular{border-color:#4bae6e;background:linear-gradient(135deg,rgba(75,174,110,.14),var(--surface) 60%)}
.cycle.ovulatoria{border-color:#e0b020;background:linear-gradient(135deg,rgba(224,176,32,.14),var(--surface) 60%)}
.cycle.lutea{border-color:#5aa7d8;background:linear-gradient(135deg,rgba(90,167,216,.14),var(--surface) 60%)}
.cyc-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:9px;position:relative}
.cyc-bar div{height:100%}
.cyc-mark{position:absolute;top:-3px;width:3px;height:14px;background:var(--text);border-radius:2px}
/* Progreso */
.progress-pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.progress-pick button{font-family:'Barlow Condensed';font-weight:700;font-size:13px;padding:7px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.progress-pick button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.chart-wrap{position:relative}
.chart{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;touch-action:none;cursor:crosshair}
.chart-tip{position:absolute;top:6px;transform:translateX(-50%);background:#0e0d0b;border:1px solid var(--line);color:var(--text);font-size:12px;padding:5px 9px;border-radius:8px;
  pointer-events:none;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5}
.chart-tip b{color:var(--warm)}
.chart-ctrls{display:flex;gap:6px;justify-content:center;margin-top:8px}
.cbtn{width:42px;height:34px;border-radius:9px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:16px;font-weight:700}
.chart-legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.lg-line{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-left:8px}
.ov-wrap{display:flex;flex-direction:column;gap:10px}
.ov-row{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer}
.ov-row.cur{border-color:var(--accent)}
.ov-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.ov-name{font-family:'Barlow Condensed';font-weight:700;font-size:16px;text-transform:uppercase}
.ov-pcts{font-family:'Barlow Condensed';font-weight:700;font-size:17px;color:var(--accent)}
.ov-bar{position:relative;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.ov-ghost{position:absolute;left:0;top:0;height:100%;background:rgba(230,184,103,.25);border-radius:99px}
.ov-fill{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--accent-deep),var(--accent));border-radius:99px;z-index:2}
.ov-sub{margin-top:6px;font-size:12px;color:var(--muted)}
.ov-sub b{color:var(--text)}
/* Calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.cal-nav{font-size:24px;color:var(--accent);width:42px;height:42px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow div{text-align:center;font-size:11px;color:var(--faint);font-weight:700;padding-bottom:4px;font-family:'Barlow Condensed'}

/* ---------- 4) Utilidades de fecha ---------- */
const todayIso=()=>dateToIso(new Date());
function isoToDate(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function dateToIso(dt){ return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }
function daysBetween(a,b){ return Math.round((isoToDate(b)-isoToDate(a))/86400000); }
function addDays(iso,n){ const d=isoToDate(iso); d.setDate(d.getDate()+n); return dateToIso(d); }
function formatEs(iso){ return isoToDate(iso).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}); }
function shortEs(iso){ return isoToDate(iso).toLocaleDateString('es-ES',{day:'numeric',month:'short'}); }
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toSec(t){ if(t==null||t==='') return 0; const s=String(t).trim(); if(s.includes(':')){ const [m,x]=s.split(':'); return (+m||0)*60+(+x||0);} return +s||0; }
function fmtSec(s){ s=Math.round(s||0); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

let _rc=null,_rk='';
function reachable(){ const key=S.cfg.plates.join(','); if(_rk===key&&_rc) return _rc;
  const step=0.25,N=Math.round(200/step)+1,r=new Array(N).fill(false); r[0]=true;
  S.cfg.plates.filter(p=>p>0).forEach(p=>{ const pi=Math.round(p/step); if(pi>0) for(let i=pi;i<N;i++) if(r[i-pi]) r[i]=true; });
  _rc=r;_rk=key; return r; }
function isLoadable(w){ const bar=S.cfg.bar; if(w<bar-1e-9) return false; const per=(w-bar)/2, f=per/0.25, i=Math.round(f);
  if(Math.abs(f-i)>1e-6) return false; const r=reachable(); return i>=0&&i<r.length&&r[i]; }
function nearestLoadable(t){ const bar=S.cfg.bar; if(!(t>bar)) return bar;
  for(let d=0;d<=30.0001;d+=0.25){ if(isLoadable(t-d)) return +(t-d).toFixed(2); if(isLoadable(t+d)) return +(t+d).toFixed(2); } return Math.round(t*2)/2; }
function nextLoadableAbove(w){ for(let d=0.25;d<=30;d+=0.25) if(isLoadable(w+d)) return +(w+d).toFixed(2); return w+1; }
function plateBreakdown(target){ const bar=S.cfg.bar; if(target<=bar) return []; let per=(target-bar)/2,out=[];
  for(const p of [...S.cfg.plates].sort((a,b)=>b-a)){ while(per+1e-9>=p){ out.push(p); per=Math.round((per-p)*100)/100; } } return out; }
const plateColor=p=>({25:'var(--p25)',20:'var(--p20)',15:'var(--p15)',10:'var(--p10)',5:'var(--p5)',2.5:'var(--p2)'}[p]||'var(--p1)');

  const txt=ps.length?`Barra ${S.cfg.bar} + ${ps.join(' + ')} por lado`:`Solo barra (${S.cfg.bar} kg)`;
  return `<div class="barbell">${ps.map(pl).join('')}<div class="sleeve"></div><div class="sleeve" style="width:40px"></div><div class="sleeve"></div>${ps.slice().reverse().map(pl).join('')}</div><div class="platecalc-note">${txt}</div>`; }

/* ---------- 6) MOTOR FASE II (progresión lineal, pág. 240-243) ---------- */
const F2T=()=>S.cfg.f2total||24;
const f2Week=s=>Math.ceil(s/3);
function hipKey(s){ return ((s/2)%2===1)?'glute_bridge':'hip_thrust'; }   // B alterna: 1ª B lev. cadera con barra, 2ª hip thrust
function sessionLifts(s){ return s%2===1?['sentadilla','banca','peso_muerto']:[hipKey(s),'militar',S.cfg.clean?'clean':'remo']; }
const appearsIn=(k,s)=>sessionLifts(s).includes(k);
const f2Logged=s=>!!(S.f2.logs[s]&&S.f2.logs[s].date);
function lastF2(){ const d=Object.keys(S.f2.logs).map(Number).filter(f2Logged); return d.length?Math.max(...d):0; }
function baseInc(k,p){ const m=p<=12?1:2; return S.cfg.inc[LIFTS[k].grp+m]; }
function deloadsFor(k){ return (S.cfg.deloads&&S.cfg.deloads[k])||[]; }
function startWork(k){ const rm=S.cfg.rm[k]||S.cfg.bar; return Math.max(S.cfg.bar, Math.round(rm*(1-S.cfg.descarga)/S.cfg.minInc)*S.cfg.minInc); }
function outOf(s,k){ const l=S.f2.logs[s]; return (l&&l.out&&l.out[k])||{}; }
function earned(k,p,inc){ const l=S.f2.logs[p]; if(l&&l.ligera) return 0; const r=outOf(p,k).r||'limpio';
  return r==='fallo'?0:(r==='forzado'?inc/2:inc); }
function factorAt(k,p){ let f=1; deloadsFor(k).forEach(d=>{ if(d.session<=p) f=d.factor??f; }); return f; }
function workWeight(k,s){ if(!appearsIn(k,s)) return null; const dls=deloadsFor(k);
  let w=startWork(k), fac=1;
  for(let p=1;p<=s;p++){ if(!appearsIn(k,p)) continue;
    const dl=dls.filter(d=>d.session===p).pop(); if(dl){ w=dl.weight; fac=dl.factor??fac; }
    if(p===s) return +w.toFixed(2);
    w+=earned(k,p,baseInc(k,p)*fac); }
  return +w.toFixed(2); }
function curInc(k,s){ return baseInc(k,s)*factorAt(k,s); }
function consecutiveFails(k){ const since=Math.max(1,...deloadsFor(k).map(d=>d.session)); const apps=[];
  for(let p=since;p<=F2T();p++) if(appearsIn(k,p)&&f2Logged(p)&&!S.f2.logs[p].ligera) apps.push(p);
  let c=0; for(let i=apps.length-1;i>=0;i--){ if(outOf(apps[i],k).r==='fallo') c++; else break; } return c; }
function prevAppearance(k,s){ for(let p=s-1;p>=1;p--) if(appearsIn(k,p)&&f2Logged(p)) return p; return null; }

function sessionW(k,s){ const l=S.f2.logs[s]; const ov=l&&l.override&&l.override[k]; let W=ov!=null?ov:nearestLoadable(workWeight(k,s));
  if(l&&l.ligera) W=nearestLoadable(W*0.6); return W; }
/* Calentamiento por ejercicio (pág. 161): barra×5 · 40-50%×5 · 60%×3-4 · 80-85%×2.
   Si ya calentaste el mismo grupo antes en la sesión → solo las 2 últimas. */
function warmups(W, reduced){ const bar=S.cfg.bar;
  let l=[{r:'1×5',w:bar,rest:30,t:'Barra'},{r:'1×5',w:nearestLoadable(Math.max(bar,W*0.45)),rest:30},{r:'1×3',w:nearestLoadable(Math.max(bar,W*0.6)),rest:60},{r:'1×2',w:nearestLoadable(Math.max(bar,W*0.82)),rest:60}];
  l=l.filter((x,i)=>i===0||(x.w<W && x.w>l[i-1].w));

  return l; }
function buildF2(s){ const isA=s%2===1; const seen=new Set();
  const lifts=sessionLifts(s).map(k=>{ const L=LIFTS[k], W=sessionW(k,s), reduced=seen.has(L.wg); seen.add(L.wg);
    const wu=warmups(W,reduced).map(x=>({...x,work:false}));
    const work=Array.from({length:L.sets},()=>({r:`1×${L.reps}`,w:W,work:true}));
    return {key:k,label:L.label,scheme:`${L.sets}×${L.reps}`,W,reduced,sets:[...wu,...work],page:L.page}; });
  return {s,day:isA?'A':'B',lifts,acc:F2_ACC[isA?'A':'B']}; }
function f2Log(s){ if(!S.f2.logs[s]) S.f2.logs[s]={sets:{},out:{},notes:{},acc:{},override:{}}; const l=S.f2.logs[s];

/* ---------- 7) Estimaciones de 1RM y siembra de pesos (fases III y IV) ---------- */
const DP_SPECS={}; F3_DAYS.forEach(d=>d.ex.forEach(e=>{ if(e.kind==='carga') DP_SPECS[e.id]=e; }));
Object.values(F4).forEach(b=>['A','B'].forEach(x=>b[x].forEach(e=>{ if(e.kind==='carga') DP_SPECS[e.id]=e; })));
function est1RM(base){
  for(const ph of ['f4','f3']){ const W=S[ph].weights; let best=null;
    Object.keys(W).forEach(id=>{ const sp=DP_SPECS[id]; if(sp&&sp.base===base&&W[id]>0){ const v=W[id]*EP(sp.rMin); if(!best||v>best) best=v; } });
    if(best) return best; }
  if(LIFTS[base]){ const s=nextAppearance(base)||F2T(); let w=null;
    for(let p=Math.min(s,F2T());p>=1;p--) if(appearsIn(base,p)){ w=workWeight(base,p); break; }
    if(w) return w*EP(LIFTS[base].reps); }
  const der={sent_frontal:['sentadilla',0.8],rumano:['peso_muerto',0.7],desplantes:['sentadilla',0.45],remo:['banca',0.9],hip_thrust:['glute_bridge',0.9],glute_bridge:['hip_thrust',1.1]}[base];
  if(der){ const b=est1RM(der[0]); if(b) return b*der[1]; }
  return null; }
function seedWeight(base,rMin){ const o=est1RM(base); return o?nearestLoadable(o/EP(rMin)):S.cfg.bar; }
function best1RMFromLog(w,sets){ const r=Math.max(0,...(sets||[]).map(x=>+x||0)); return r>0&&w>0?w*EP(r):null; }

  if(!started){ if(n===2) return openGrad2(); if(n===3) return openGrad3(); if(n===4) return openGrad4(); }
  askConfirm(`Cambiar a Fase ${FASE_N[n]}. Cada fase guarda sus datos: no se borra nada.`,()=>{ S.fase=n; save(); f2Mode=null; view='hoy'; render(); window.scrollTo(0,0); },'Cambiar'); }
function rmFields(){ return ['sentadilla','banca','peso_muerto','glute_bridge','hip_thrust','militar','clean'].map(k=>`<div class="field"><label>${LIFTS[k].label}</label><input type="number" inputmode="decimal" data-rm="${k}" value="${S.cfg.rm[k]}"></div>`).join(''); }
function readRm(box){ box.querySelectorAll('[data-rm]').forEach(i=>{ const v=parseFloat(i.value); if(v>0) S.cfg.rm[i.dataset.rm]=v; }); }
function openGrad2(){ const box=openDlg(`<h3 class="dl-title">Empezar Fase II · Fuerza</h3>
  <p class="dl-intro">Introduce tu <b>5RM estimado</b> (peso con el que harías 5 repeticiones limpias). La app <b>resta un ${Math.round(S.cfg.descarga*100)}%</b> y arrancas desde ahí (pág. 236). Si no tienes ni idea, pon algo conservador: en la 1ª sesión subes hasta que la barra se frene y lo anclas con ✎.</p>
  <div class="grid2">${rmFields()}</div>
  <label class="alt-toggle"><input type="checkbox" id="g_clean" ${S.cfg.clean?'checked':''}> Puedo hacer clean (si no: remo 3×5)</label>
  <div class="btn-row"><button class="btn ghost" id="gc">Cancelar</button><button class="btn" id="gg">Empezar</button></div>`);
  box.querySelector('#gc').onclick=closeDlg;
  box.querySelector('#gg').onclick=()=>{ readRm(box); S.cfg.clean=box.querySelector('#g_clean').checked; S.f2.started=todayIso(); S.fase=2; S.f2.cur=lastF2()+1; save(); closeDlg(); view='hoy'; render(); toast('¡A por la Fase II!'); }; }
function gradRows(list,weights){ return list.map(ex=>`<div class="stat-line"><span>${esc(ex.label)} <span class="tiny">${ex.sets}×${ex.rMin}-${ex.rMax}</span></span><input class="inline-num" style="width:80px!important" type="number" inputmode="decimal" data-gw="${ex.id}" value="${weights[ex.id]??seedWeight(ex.base,ex.rMin)}"></div>`).join(''); }
function openGrad3(){ const list=F3_DAYS.flatMap(d=>d.ex.filter(e=>e.kind==='carga'));
  const box=openDlg(`<h3 class="dl-title">Empezar Fase III · Hipertrofia</h3>
  <p class="dl-intro">Ya no eres novata: torso-pierna con días de fuerza (empieza con tu <b>3RM</b>) e hipertrofia (tu <b>8RM</b>). He estimado los pesos desde tus marcas de Fase II con la fórmula del libro (pág. 237, 257). Los ejercicios nuevos (frontal, rumano, desplantes, remo) son <b>orientativos</b>: ajústalos en la 1ª sesión.</p>
  ${gradRows(list,S.f3.weights)}
  <div class="btn-row"><button class="btn ghost" id="gc">Cancelar</button><button class="btn" id="gg">Empezar Fase III</button></div>`);
  box.querySelector('#gc').onclick=closeDlg;
  box.querySelector('#gg').onclick=()=>{ box.querySelectorAll('[data-gw]').forEach(i=>{ const v=parseFloat(i.value); if(v>0) S.f3.weights[i.dataset.gw]=nearestLoadable(v); });
    S.f3.started=todayIso(); S.fase=3; save(); closeDlg(); view='hoy'; render(); toast('¡Bienvenida a la Fase III!'); }; }
function openGrad4(){ const draw=()=>{ const bio=S.cfg.biotipo; const list=bio?[...F4[bio].A,...F4[bio].B].filter(e=>e.kind==='carga'):[];
  const box=openDlg(`<h3 class="dl-title">Empezar Fase IV · Ajuste final</h3>
   <p class="dl-intro">4 semanas: full-body A/B adaptado a tu biotipo + complejos con barra el día de recarga. Pensada para un momento concreto (¿verano?). El bloque de <b>definición máxima</b> exige: buena base muscular, metabolismo sano, al menos 2-3 meses de programa y grasa ≤20-22% (pág. 198, 288). Si no, usa definición normal o mantenimiento.</p>
   ${bioPickHTML()}${bio?`<p class="eyebrow" style="margin-top:12px">Pesos de partida</p>${gradRows(list,S.f4.weights)}`:''}

   box.querySelector('#gg').onclick=()=>{ box.querySelectorAll('[data-gw]').forEach(i=>{ const v=parseFloat(i.value); if(v>0) S.f4.weights[i.dataset.gw]=nearestLoadable(v); });
     S.f4.started=todayIso(); S.fase=4; save(); closeDlg(); view='hoy'; render(); toast('Fase IV: a esculpir'); }; };

/* ---------- PLAN / CALENDARIO ---------- */
function phaseItems(){ const f=S.fase, done=[], todo=[];
  if(f===1){ const seq=f1Seq(); seq.forEach((it,i)=>{ const n=i+1, l=S.f1.logs[n]; const lab=it.t==='C'?(it.c==='LISS'?'LISS':'HIIT'):`${it.t}${it.code}`;
      const o={lab,c:it.t==='C',pos:i}; if(l&&l.date) done.push({...o,date:l.date}); else if(n>=S.f1.cur||!l) todo.push(o); }); }
  else if(f===2){ for(let s=1;s<=F2T();s++){ const l=S.f2.logs[s], o={lab:s%2?'A':'B',c:false};
      if(l&&l.date) done.push({...o,date:l.date}); else todo.push(o);
      if(s%3===0){ const w=s/3, c=S.cardio['2-'+w]||{}, d=Object.values(c).find(x=>x&&x.done);
        if(d) done.push({lab:f2CardioKey(w).includes('LISS')?'LISS':'HIIT',c:true,date:d.date||''}); else todo.push({lab:f2CardioKey(w).includes('LISS')?'LISS':'HIIT',c:true}); } } }
  else { const P=f===3?P3:P4, st=S[P.ph]; Object.entries(st.logs).forEach(([n,l])=>{ if(l.date){ const d=P.day(+n); done.push({lab:d.id.toUpperCase(),c:!!d.cardio,date:l.date}); } });
    const tot=f===3?st.cur+19:16; for(let n=st.cur;n<=tot;n++){ const d=P.day(n); todo.push({lab:d.id.toUpperCase(),c:!!d.cardio,dayId:d.id}); } }
  return {done,todo}; }
function gapAfter(item,next){ const f=S.fase; if(!next) return 0;
  if(f===1&&S.cfg.f1modo==='5d'){ return [1,2,1,1,2][item.pos%5]; }
  if(f===3){ return {tf:1,pf:2,th:1,ph:1,po:2}[item.dayId]||1; }
  if(next.c) return 1; return 2; }
function lastTrained(done){ const d=done.map(x=>x.date).filter(Boolean).sort(); return d.length?d[d.length-1]:null; }
let calRef=null;
function renderPlan(){ const {done,todo}=phaseItems(); const t=todayIso();
  let start=t; const last=lastTrained(done); if(last){ const st=addDays(last,todo[0]&&todo[0].c?1:2); if(st>start) start=st; }
  if(S.cfg.resumeDate&&S.cfg.resumeDate>start) start=S.cfg.resumeDate;
  const dmap={}; done.forEach(x=>{ if(x.date) dmap[x.date]=x; });
  const pmap={}; let cur=start, end=null;
  todo.forEach((x,i)=>{ while(dmap[cur]) cur=addDays(cur,1); pmap[cur]=x; end=cur; cur=addDays(cur,gapAfter(x,todo[i+1])); });
  // días de regla previstos
  const reg={}; const ci=cicloInfo(); if(ci&&!ci.anticon){ [...S.ciclo.starts, ci.next, addDays(ci.next,ci.len), addDays(ci.next,2*ci.len)].forEach(s=>{ for(let k=0;k<(+S.ciclo.regla||5);k++) reg[addDays(s,k)]=1; }); }
  if(!calRef){ const d=new Date(); calRef=new Date(d.getFullYear(),d.getMonth(),1); }
  const y=calRef.getFullYear(), m=calRef.getMonth(), wd=(new Date(y,m,1).getDay()+6)%7, dim=new Date(y,m+1,0).getDate();
  let cells=''; for(let i=0;i<wd;i++) cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=dim;d++){ const iso=dateToIso(new Date(y,m,d)), r=dmap[iso], p=pmap[iso], x=r||p;
    cells+=`<div class="cal-cell ${x?(x.c?'h':'f'):''} ${iso===t?'today':''}"><span class="cal-d">${d}</span>${x?`<span class="cal-lab">${x.lab}</span>`:''}${r?'<span class="cal-chk">✓</span>':''}${reg[iso]?'<span class="regla"></span>':''}</div>`; }
  const week3=S.fase===3?`<p class="eyebrow" style="margin-top:16px">Semana tipo Fase III (pág. 252)</p><div class="wk">${[['Lun','Torso · Fuerza','tf'],['Mar','Pierna · Fuerza','pf'],['Mié','Descanso',''],['Jue','Torso · Hipertrofia','th'],['Vie','Pierna · Hipertrofia','ph'],['Sáb','Potencia + HIIT/LISS','po'],['Dom','Descanso','']].map(([a,b,id])=>`<div class="wkd ${id?'':'rest'} ${id&&P3.day(S.f3.cur).id===id?'now':''}"><span class="wkd-d">${a}</span><span class="wkd-n">${b}</span>${id&&P3.day(S.f3.cur).id===id?'<span class="wkd-tag">TOCA</span>':''}</div>`).join('')}</div>
     <div class="note">El sábado (potencia) es flotante: si una semana no puedes, sáltalo. Puedes alargar esta fase mientras progreses.</div>`:'';
  app.innerHTML=`<p class="eyebrow">Plan · Fase ${FASE_N[S.fase]}</p>
    <div class="cal-head"><button class="cal-nav" id="cp">‹</button><h2 class="cond" style="font-size:22px;text-transform:capitalize;margin:0">${calRef.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</h2><button class="cal-nav" id="cn">›</button></div>
    <div class="cal-grid cal-dow">${['L','M','X','J','V','S','D'].map(x=>`<div>${x}</div>`).join('')}</div><div class="cal-grid">${cells}</div>
    <div class="cal-legend"><span class="lg" style="background:rgba(217,71,63,.45)"></span>Fuerza <span class="lg" style="background:rgba(230,184,103,.45)"></span>Quema-grasa <span class="lg" style="background:#e05a74;border-radius:50%;width:8px;height:8px"></span>Regla (prevista) · ✓ hecho</div>
    <div class="card"><div class="card-body body-open">
      <div class="field"><label>Próximo entrenamiento (cámbialo si te vas unos días)</label><input type="date" id="rd" value="${start}" min="${t}"></div>
      <div class="stat-line">Pendientes${S.fase===3?' (próximas 4 semanas)':''}<b>${todo.length}</b></div>
      ${S.fase!==3&&end?`<div class="stat-line">Fin estimado de fase<b>${formatEs(end)}</b></div>`:''}
    </div></div>${week3}
    <p class="tiny center">El plan se proyecta desde hoy y se recoloca solo. Nunca dos días de fuerza del mismo músculo seguidos (≥48 h, pág. 83).</p>`;
  document.getElementById('cp').onclick=()=>{ calRef=new Date(y,m-1,1); renderPlan(); };
  document.getElementById('cn').onclick=()=>{ calRef=new Date(y,m+1,1); renderPlan(); };
  document.getElementById('rd').onchange=e=>{ S.cfg.resumeDate=e.target.value||null; save(); renderPlan(); toast('Calendario recolocado'); }; }

/* ---------- HISTORIAL ---------- */
let histTab=null;
function renderHistorial(){ if(!histTab) histTab='f'+S.fase;
  const tabs=[['f1','Fase I'],['f2','Fase II'],['f3','Fase III'],['f4','Fase IV'],['cardio','Quema-grasa']];
  const rows=[];
  if(histTab==='f1'){ const seq=f1Seq(); Object.entries(S.f1.logs).forEach(([n,l])=>{ if(!l.date) return; const it=seq[n-1]||{};
      rows.push({date:l.date,t:it.t==='C'?'Quema-grasa · semana '+it.w:`Sesión ${it.t}${it.code} · semana ${it.w}`,sum:it.t==='C'?Object.entries(l.cardio||{}).map(([k,v])=>cardioSummary(k,v)).join(''):`${Object.keys(l.ex||{}).length} ejercicios`,
        setD:v=>{l.date=v;},del:()=>{ delete S.f1.logs[n]; }}); }); }
  if(histTab==='f2') Object.keys(S.f2.logs).map(Number).forEach(s=>{ const l=S.f2.logs[s]; if(!l.date) return;
    rows.push({date:l.date,t:`Sesión ${s} · ${s%2?'A':'B'}${l.ligera?' · ligera':''}`,sum:sessionLifts(s).map(k=>`${LIFTS[k].label} ${sessionW(k,s)} kg${outOf(s,k).r==='fallo'?' ✗':outOf(s,k).r==='forzado'?' ●':''}`).join(' · '),
      setD:v=>{l.date=v;},del:()=>{ delete S.f2.logs[s]; S.f2.cur=lastF2()+1; },edit:()=>{ S.f2.cur=s; S.fase=2; f2Mode='fuerza'; view='hoy'; }}); });
  if(histTab==='f3'||histTab==='f4'){ const P=histTab==='f3'?P3:P4; Object.entries(S[P.ph].logs).forEach(([n,l])=>{ if(!l.date) return; const d=P.day(+n);
      rows.push({date:l.date,t:`${d.name}${l.skipped?' · saltado':''}`,sum:Object.entries(l.ex||{}).filter(([id])=>DP_SPECS[id]).map(([id,e])=>`${DP_SPECS[id].label} ${e.w??''}kg ${(e.sets||[]).filter(x=>x!=='').join('·')}`).join(' · ')+Object.entries(l.cardio||{}).map(([k,v])=>v.done?' · '+CARDIO[k].tag+' '+cardioSummary(k,v):'').join(''),
        setD:v=>{l.date=v;},del:()=>{ delete S[P.ph].logs[n]; },edit:()=>{ S[P.ph].cur=+n; S.fase=P.fase; view='hoy'; }}); }); }
  if(histTab==='cardio') allCardioLogs().forEach(x=>rows.push({date:x.v.date||'',t:`${CARDIO[x.k].tag} · Fase ${x.fase}`,sum:cardioSummary(x.k,x.v),setD:v=>{x.v.date=v;},del:()=>{ x.v.done=false; }}));
  rows.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  app.innerHTML=`<p class="eyebrow">Historial</p><div class="ntabs" id="ht">${tabs.map(([k,l])=>`<button data-h="${k}" class="${histTab===k?'sel':''}">${l}</button>`).join('')}</div>
    ${rows.length?'':'<div class="note">Nada registrado aún aquí.</div>'}<div id="hl"></div>`;
  document.querySelectorAll('#ht [data-h]').forEach(b=>b.onclick=()=>{ histTab=b.dataset.h; renderHistorial(); });
  const hl=document.getElementById('hl');
  rows.forEach(r=>{ const c=document.createElement('div'); c.className='card';
    c.innerHTML=`<div class="card-head"><div class="left"><span class="ex-name" style="font-size:16px">${esc(r.t)}</span></div><span class="ex-scheme">${r.date?shortEs(r.date):''} <span class="chev">▶</span></span></div>
      <div class="card-body"><p style="font-size:13px;color:var(--muted);margin:4px 0 10px">${esc(r.sum)||'—'}</p>
      <div class="field"><label>Fecha</label><input type="date" value="${r.date}"></div>
      <div class="btn-row">${r.edit?'<button class="btn ghost" data-e>Abrir / editar</button>':''}<button class="btn deep" data-d>Borrar</button></div></div>`;
    c.querySelector('.card-head').onclick=()=>c.classList.toggle('open');
    c.querySelector('input[type=date]').onchange=e=>{ r.setD(e.target.value); save(); toast('Fecha actualizada'); };
    c.querySelector('[data-d]').onclick=()=>askConfirm('¿Borrar este registro? No se puede deshacer.',()=>{ r.del(); save(); renderHistorial(); toast('Borrado'); },'Borrar');
    const e=c.querySelector('[data-e]'); if(e) e.onclick=()=>{ r.edit(); save(); render(); window.scrollTo(0,0); };
    hl.appendChild(c); }); }

/* ---------- PROGRESO ---------- */
let progTab='std', progLift='sentadilla';
function peso7d(){ const ds=Object.keys(S.body.daily).filter(d=>S.body.daily[d].peso>0).sort(); if(!ds.length) return +S.cfg.nutri.peso||null;
  const last=ds[ds.length-1], v=ds.filter(d=>daysBetween(d,last)<=6).map(d=>S.body.daily[d].peso); return +(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1); }
function timeChart(svg,tip,series,o={}){ const all=series.flatMap(s=>s.pts); if(!all.length){ svg.innerHTML='<text x="172" y="118" fill="var(--faint)" font-size="11" text-anchor="middle" font-family="Inter">Sin datos aún</text>'; return; }
  const xs=all.map(p=>p.x).sort(), x0=xs[0], x1=xs[xs.length-1], span=Math.max(1,daysBetween(x0,x1));
  let ys=all.map(p=>p.y); if(o.hline!=null) ys.push(o.hline); if(o.band) ys.push(...o.band);
  let lo=Math.min(...ys), hi=Math.max(...ys); const pad=(hi-lo)*0.1||2; lo-=pad; hi+=pad;
  const W=344,H=236,mL=38,mR=12,mT=14,mB=24,X=d=>mL+(W-mL-mR)*daysBetween(x0,d)/span,Y=v=>H-mB-(H-mT-mB)*(v-lo)/(hi-lo);
  let g=''; for(let i=0;i<=4;i++){ const v=lo+(hi-lo)*i/4, yy=Y(v).toFixed(1); g+=`<line x1="${mL}" y1="${yy}" x2="${W-mR}" y2="${yy}" stroke="var(--line)" stroke-width=".7"/><text x="${mL-5}" y="${+yy+3}" fill="var(--faint)" font-size="9" text-anchor="end" font-family="Inter">${v>=100?Math.round(v):+v.toFixed(1)}</text>`; }
  if(o.band) g+=`<rect x="${mL}" y="${Y(o.band[1]).toFixed(1)}" width="${W-mL-mR}" height="${(Y(o.band[0])-Y(o.band[1])).toFixed(1)}" fill="rgba(75,174,110,.12)"/>`;
  if(o.hline!=null){ const hy=Y(o.hline).toFixed(1); g+=`<line x1="${mL}" y1="${hy}" x2="${W-mR}" y2="${hy}" stroke="#4bae6e" stroke-width="1.5" stroke-dasharray="5 3"/><text x="${W-mR-2}" y="${hy-4}" fill="#4bae6e" font-size="9" font-weight="700" text-anchor="end" font-family="Inter">${o.hlabel||''}</text>`; }
  const path=pts=>pts.map((p,i)=>`${i?'L':'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');

let nutPhase=null, nutDay='entreno';
function macros(kcal,P,CH){ const G=Math.max(0,Math.round((kcal-P*4-CH*4)/9)); return {P:Math.round(P),CH:Math.round(CH),G,gp:Math.round(G*9/kcal*100)}; }
function nutCalc(){ const n=S.cfg.nutri, ed=+n.edad, al=+n.altura, pe=+n.peso||peso7d(), gr=+n.grasa; if(!(ed>0&&al>0&&pe>0)) return null;
  const mif=10*pe+6.25*al-5*ed-161; let tmb=mif, met='Harris-Benedict (Mifflin-St Jeor, mujer)';
  if(gr>0&&gr<60){ const kat=370+21.6*pe*(1-gr/100); tmb=(mif+kat)/2; met='media Mifflin + Katch-McArdle'; }
  const mant=tmb*1.55, bio=S.cfg.biotipo, man=bio==='manzana', rest=nutDay==='descanso';
  const mPct={manzana:[25,35],pera:[22,45],esparrago:[22,43]}[bio]||[22,40];
  const blocks=[
    {k:'mant',n:'Mantenimiento',s:`P ${mPct[0]}% · CH ${mPct[1]}% · resto grasa`,kcal:mant,m:macros(mant,mant*mPct[0]/100/4,mant*mPct[1]/100/4)},
    {k:'vol',n:'Volumen',s:'+10% · P 1,8-2 g/kg · CH 3-5 g/kg',kcal:mant*1.10*(rest?0.875:1),m:null,P:1.9*pe,CH:(rest?(man?3:3.5):(man?3.5:4.5))*pe},
    {k:'def',n:'Definición',s:'−15-20% · P 2-2,2 g/kg · CH 2-4 g/kg · 4-6 sem máx',kcal:mant*0.825,P:2.1*pe,CH:(rest?2:(man?2.5:3))*pe},
    {k:'max',n:'Definición máxima',s:'−30% · P 2-2,3 g/kg (comida real) · CH ~1 g/kg · grasa 40-60%',kcal:mant*0.70,P:2.15*pe,CH:1*pe},
    {k:'rec',n:'Día de recarga',s:'+10-15% sobre mantenimiento · CH 50-60% · grasa baja',kcal:mant*1.125,P:2.1*pe,CH:mant*1.125*0.55/4}];
  blocks.forEach(b=>{ if(!b.m) b.m=macros(b.kcal,b.P,b.CH); });
  return {tmb,met,mant,pe,blocks}; }

  <button class="btn" id="sv">Guardar cambios</button>
  <div class="btn-row"><button class="btn ghost" id="ex">Exportar datos</button><button class="btn ghost" id="im">Importar</button></div><input type="file" id="imf" accept="application/json" style="display:none">
  <button class="btn ghost" id="rph">↺ Reiniciar la fase activa (mantiene ajustes)</button>
  <button class="btn deep" id="rs" style="margin-top:10px">Borrar todo</button>
  <p class="tiny center" style="margin-top:10px">Los datos viven solo en este navegador (clave <code>guerrera_v2</code>). Exporta a menudo como copia de seguridad.</p>`;
  wireFaseSw();
  document.getElementById('sv').onclick=()=>{ readRm(app);
    app.querySelectorAll('[data-c]').forEach(i=>{ const k=i.dataset.c, v=i.value;
      if(k==='descarga') c.descarga=Math.min(0.6,Math.max(0,(+v||40)/100)); else if(k==='plates') c.plates=v.split(',').map(x=>parseFloat(x)).filter(x=>x>0).sort((a,b)=>b-a);
      else if(k==='f1modo') c.f1modo=v; else if(k==='cur2') S.f2.cur=Math.max(1,parseInt(v)||1); else if(k==='f2total') c.f2total=Math.max(6,parseInt(v)||24); else c[k]=+v||c[k]; });
    app.querySelectorAll('[data-i]').forEach(i=>{ c.inc[i.dataset.i]=+i.value||c.inc[i.dataset.i]; });
    app.querySelectorAll('[data-b]').forEach(i=>{ c[i.dataset.b]=i.checked; }); _rc=null; save(); toast('Guardado'); render(); };
  document.getElementById('ex').onclick=()=>{ const b=new Blob([JSON.stringify({_app:'GuerreraEspartana',_v:2,_exported:new Date().toISOString(),data:S},null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`guerrera-datos-${todayIso()}.json`; a.click(); toast('Exportado'); };
  document.getElementById('im').onclick=()=>document.getElementById('imf').click();
  document.getElementById('imf').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{ try{ const d=JSON.parse(rd.result), t=d.data||d; if(!t.cfg) throw 0; askConfirm('Esto REEMPLAZA todos los datos de este dispositivo. ¿Continuar?',()=>{ S=migrate(t); save(); view='hoy'; render(); toast('Datos restaurados'); },'Restaurar'); }catch(x){ toast('Archivo no válido'); } };
    rd.readAsText(f); e.target.value=''; };
  document.getElementById('rph').onclick=()=>askConfirm(`¿Reiniciar la Fase ${FASE_N[S.fase]}? Se borran sus registros.`,()=>{ const f=S.fase;
    if(f===1) S.f1={cur:1,logs:{}}; if(f===2){ S.f2={cur:1,logs:{},started:todayIso()}; S.cfg.deloads={}; Object.keys(S.cardio).filter(k=>k.startsWith('2-')).forEach(k=>delete S.cardio[k]); }
    if(f===3) S.f3={cur:1,logs:{},weights:S.f3.weights,started:todayIso()}; if(f===4) S.f4={cur:1,logs:{},weights:S.f4.weights,started:todayIso()};
    save(); view='hoy'; render(); toast('Fase reiniciada'); },'Reiniciar');
  document.getElementById('rs').onclick=()=>askConfirm('¿Borrar TODO y empezar de cero? No se puede deshacer.',()=>{ localStorage.removeItem(KEY); S=freshState(); view='hoy'; render(); },'Borrar'); }

/* ---------- Arranque ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ view=b.dataset.view; if(view==='historial') histTab=null; if(view==='dieta') nutPhase=null; if(view==='hoy') f2Mode=null; render(); window.scrollTo(0,0); });
document.getElementById('rest-skip').onclick=stopRest;
render();
</script>
</body>
</html>
